name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install ruff==0.15.13
      - run: ruff check .
      - run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python manage.py test --verbosity=2

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t escala-midia .

  deploy:
    needs: [lint, test, build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Chamar webhook de deploy
        run: |
          curl -s -X POST "https://Aurineque.pythonanywhere.com/deploy/" \
            -H "X-Deploy-Token: ${{ secrets.DJANGO_DEPLOY_TOKEN }}" \
            --max-time 180
      - name: Verificar resultado
        run: |
          echo "Deploy disparado. Verifique o log em:"
          echo "  https://Aurineque.pythonanywhere.com/deploy/"
