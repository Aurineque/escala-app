<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Me Voluntariar</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; max-width: 400px; margin: auto; }
        .btn-salvar { background-color: #28a745; color: white; padding: 10px; border: none; border-radius: 5px; cursor: pointer; }
        .btn-voltar { background-color: #6c757d; color: white; padding: 10px; text-decoration: none; border-radius: 5px; display: inline-block; margin-top: 10px;}
    </style>
</head>
<body>

    <h2>Servir no: {{ evento.nome }}</h2>
    <p>Data: {{ evento.data|date:"d/m/Y às H:i" }}</p>

    <form method="POST">
        {% csrf_token %} {{ form.as_p }}  <button type="submit" class="btn-salvar">Confirmar Presença</button>
    </form>

    <a href="{% url 'lista_eventos' %}" class="btn-voltar">Voltar</a>

</body>
</html>
